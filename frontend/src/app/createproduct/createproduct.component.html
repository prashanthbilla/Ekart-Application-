 <header class="global-header">
    <div class="header-left">
      <h1>🛒 Ekart Application</h1>
    </div>
    <div class="header-right">
      <button class="logout-button" (click)="logout()">Logout</button>
    </div>
  </header>


<div class="update-product-container">
  <h2>➕ Add Product</h2>

  <form (ngSubmit)="onSubmit()" #productForm="ngForm">
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" [(ngModel)]="product.productName" name="productName" required />
    </div>

    <div class="form-group">
      <label>Category</label>
      <select [(ngModel)]="product.categoryId" name="categoryId" required>
        <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Product Details</label>
      <textarea [(ngModel)]="product.productDetails" name="productDetails" rows="3" required></textarea>
    </div>

    <div class="form-group">
      <label>Actual Price</label>
      <input type="number" [(ngModel)]="product.actualPrice" name="actualPrice" required />
    </div>

    <div class="form-group">
      <label>Offer %</label>
      <input type="number" [(ngModel)]="product.offerPercentage" name="offerPercentage" />
    </div>

    <div class="form-group">
      <label>Reward Points</label>
      <input type="number" [(ngModel)]="product.usageRewardPoints" name="usageRewardPoints" />
    </div>

    <div class="form-group">
      <label>Product Image</label>
      <input type="file" (change)="onImageSelected($event)" />
    </div>

    <div class="form-group" *ngIf="imagePreview">
      <label>Preview</label>
      <img [src]="imagePreview" width="150" alt="Preview" />
    </div>

    <!-- Optional image path field -->
    <div class="form-group" *ngIf="product.productImageUrl">
      <label>Image Path</label>
      <input type="text" [(ngModel)]="product.productImageUrl" name="productImageUrl" readonly />
    </div>

    <button type="submit" class="update-btn">Submit Product</button>
  </form>
</div>

<footer class="global-footer">
  <p>© 2026 Ekart — All rights reserved.</p>
</footer>
