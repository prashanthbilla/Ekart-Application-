<header class="global-header">
    <div class="header-left">
      <h1>🛒 Ekart Application</h1>
    </div>
    <div class="header-right">
      <button class="logout-button" (click)="logout()">Logout</button>
    </div>
  </header>

<div class="update-user-container">
  <!-- Profile Picture Section -->
  <div class="profile-picture-wrapper">
    <img
      class="profile-picture"
      [src]="'assets/profilepics/' + user.userName + '.jpeg'"
      alt="Profile Picture"
      (error)="profileFallback($event)"
    />
    <input type="file" hidden #fileInput (change)="onProfilePicChange($event)" />
    <button type="button" class="edit-pic-btn" (click)="fileInput.click()">📸 Edit Photo</button>
  </div>

  <h2>✏️ Update User Details</h2>

  <form #updateForm="ngForm" (ngSubmit)="update()">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input id="fullName" name="fullName" [(ngModel)]="user.fullName" required />
    </div>

    <div class="form-group">
      <label for="userName">Username</label>
      <input id="userName" name="userName" [(ngModel)]="user.userName" required disabled />
    </div>

    <div class="form-group">
      <label for="emailId">Email</label>
      <input type="email" id="emailId" name="emailId" [(ngModel)]="user.emailId" required />
    </div>

    <div class="form-group">
      <label for="mobileNum">Mobile Number</label>
      <input id="mobileNum" name="mobileNum" [(ngModel)]="user.mobileNum" required />
    </div>

    <div class="form-group">
      <label for="houseNo">House No</label>
      <input id="houseNo" name="houseNo" [(ngModel)]="user.houseNo" />
    </div>

    <div class="form-group">
      <label for="landmark">Landmark</label>
      <input id="landmark" name="landmark" [(ngModel)]="user.landmark" />
    </div>

    <div class="form-group">
      <label for="city">City</label>
      <input id="city" name="city" [(ngModel)]="user.city" required />
    </div>

    <div class="form-group">
      <label for="pincode">Pincode</label>
      <input id="pincode" name="pincode" [(ngModel)]="user.pincode" required />
    </div>

    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" name="role" [(ngModel)]="user.role" required>
        <option value="ROLE_USER">User</option>
        <option value="ROLE_ADMIN">Admin</option>
      </select>
    </div>

    <button type="submit" class="update-btn" (click)="update()">Update User</button>
    <div class="error" *ngIf="signupError">{{ signupError }}</div>
  </form>
</div>

<footer class="global-footer">
  <p>© 2026 Ekart — All rights reserved.</p>
</footer>
